{% extends "base.html" %}
{% block titulo %}Registrar salida{% endblock %}
{% block contenido %}
<h1>Registrar salida de vehículo</h1>
<p class="sub">Se cierra el movimiento abierto del vehículo y se libera su celda.</p>
<form method="post" class="tarjeta" style="max-width:520px;">
  <label for="placa">Placa</label>
  <input class="placa" type="text" id="placa" name="placa" maxlength="8" value="{{ form.get('placa', '') }}" placeholder="ABC123" autofocus required>

  <label for="observaciones">Observaciones (opcional)</label>
  <textarea id="observaciones" name="observaciones" rows="3" maxlength="255">{{ form.get('observaciones', '') }}</textarea>

  <button class="boton salida" type="submit">Registrar salida</button>
  <a class="boton sec" href="{{ url_for('consultas.panel') }}" style="margin-left:8px;">Cancelar</a>
</form>
{% endblock %}
